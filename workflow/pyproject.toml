[tool.ruff]
line-length = 100
target-version = "py311"

# Règles sobres : bugs réels (F), syntaxe (E4/E7/E9), ordre des imports (I).
# Les `except Exception` défensifs (BLE001) sont assumés dans ce codebase.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
