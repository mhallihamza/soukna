# =====================================================================
# CI Soukna — même philosophie que le projet clinique :
#   • structure-and-unit : à chaque push/PR (aucun réseau, aucun secret)
#   • live-eval : MANUEL (workflow_dispatch) — 10 cas sur le vrai graphe
#     + juge LLM, KILL_SWITCH forcé à true (jamais d'envoi réel en CI)
# =====================================================================
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  structure-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r workflow/requirements.txt

      - name: Structure (fichiers, Agent Cards, compose, .env.example)
        run: python workflow/scripts/check_structure.py

      - name: Lint (ruff)
        run: ruff check workflow/

      - name: Tests unitaires hors-ligne (pytest)
        working-directory: workflow
        env:
          KILL_SWITCH: "true"
        run: pytest tests -q

  live-eval:
    if: github.event_name == 'workflow_dispatch'
    needs: structure-and-unit
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      MISTRAL_MODEL: codestral-latest
      KILL_SWITCH: "true"
    steps:
      - uses: actions/checkout@v4

      # Échec immédiat et explicite si les secrets ne sont pas configurés
      # (sinon : 30 s de retries du pool + traceback psycopg illisible).
      - name: Vérifier les secrets requis
        env:
          HAS_DB: ${{ secrets.SUPABASE_DATABASE_URL != '' }}
          HAS_MISTRAL: ${{ secrets.MISTRAL_API_KEY != '' }}
        run: |
          if [ "$HAS_DB" != "true" ] || [ "$HAS_MISTRAL" != "true" ]; then
            echo "::error::Secrets manquants — ajoute SUPABASE_DATABASE_URL et MISTRAL_API_KEY dans Settings > Secrets and variables > Actions, puis relance le workflow."
            exit 1
          fi
          # Format URI : sans ce garde, une valeur avec guillemets/espaces
          # donne 30 s de PoolTimeout illisible (missing \"=\" after \"***\").
          case "$DATABASE_URL" in
            postgresql://*|postgres://*) : ;;
            *)
              echo "::error::SUPABASE_DATABASE_URL mal formée — doit commencer par postgresql://, sans guillemets ni espaces (dotenv les enlève en local, GitHub les garde)."
              exit 1
              ;;
          esac

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r workflow/requirements.txt

      - name: Évaluation live (10 cas + juge LLM)
        working-directory: workflow
        run: python scripts/eval_suite.py

      - name: Upload rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: workflow/artifacts/eval_report.json
          if-no-files-found: warn

  docker-publish:
    # Images GHCR publiées seulement si lint + tests passent, sur push
    # vers main/master. Blitz (déploiement depuis ghcr.io) récupère le
    # tag `latest` lors de sa mise à jour nocturne.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: structure-and-unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # ghcr.io exige un chemin d'image en minuscules
      - id: img
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # URL de l'API gravée dans le bundle Next.js au build :
      # la définir dans Settings > Secrets and variables > Actions >
      # Variables (NEXT_PUBLIC_API_URL), ex. https://soukna-api.<toi>.blitz.cloud
      - uses: docker/build-push-action@v6
        with:
          context: ./dashboard
          push: true
          build-args: NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:8000' }}
          tags: ghcr.io/${{ steps.img.outputs.owner }}/soukna-dashboard:latest

      - uses: docker/build-push-action@v6
        with:
          context: ./workflow
          push: true
          tags: ghcr.io/${{ steps.img.outputs.owner }}/soukna-workflow:latest
